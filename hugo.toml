## Research section configuration
[params.research_section]
show = true
header = "Publications"

# Each research experience is its own entry. Newest first.
# /publications/ always renders every entry; the home page renders only the
# ones marked `featured = true`.
# Optional keys: image, img_posn, img_fit, venue, paper, poster, featured.
#
# img_fit controls how the thumbnail sits in its box:
#   "fit"  - the whole image is scaled down so nothing is cropped
#   "fill" - the image is cropped so that it completely fills the box (default)
# With "fill", img_posn (a CSS background-position, e.g. "50% 20%") picks which
# part of the image is kept. It has little effect with "fit".

[[params.research_section.entry]]
image = "images/bill2026assets.png"
title = "BathMap: Designing a Platform For Mapping University Bathroom Accessibility"
img_fit = "fit"
featured = true
authors = "**Bill Fan***, Stephanie Wang*, Shaini Nanayakkara, Min Kyung Lee, Lillian Chin, Earl Huff Jr."
venue = "Poster @ ACM ASSETS 2026"
blurb = """Lack of information about bathroom access is a major pain point in disabled people's access to public spaces — \
a problem known as the 'bladder's leash'. We designed a bathroom map platform that builds on a student organization's \
participatory mapping activism and combines it with crowd-sourcing. We performed open-ended formative studies, and user-testing."""
paper="https://dl.acm.org/doi/10.1145/3797867.3841228"
poster="pdfs/Bathmap_poster.pdf"

[[params.research_section.entry]]
image = "images/robosoft_25_thumbnail.png"
title = """A Fast and Model Based Approach for Evaluating Task-Competence of Antagonistic Continuum Arms"""
img_fit = "fit"
featured = true
authors = "**Bill Fan**, Jacob Roulier, Gina Olson"
venue = "Oral presentation @ Robosoft 2025"
blurb = """Determining whether a proposed continuum arm design can complete a specified task and load is \
computationally expensive due to the need for simulation. We introduce a novel method of analysis that eliminates \
the need for simulation, speeding up computation by 80x, and creates novel metrics for evaluating arm designs against tasks."""
paper="https://arxiv.org/abs/2411.00241"
poster="pdfs/Robosoft_2025_Poster.pdf"

[[params.research_section.entry]]
image = "images/ASEE 200x300.jpg"
title = """Beyond "How's it going?": A Collaborative Autoethnographic Study by Early Instructors in a First-Year Engineering Studio Course"""
img_fit = "fit"
authors = "Esme E Abbot, Berwin Lan, Luke Raus, **Bill Fan**, Zachary del Rosario"
venue = "@ ASEE 2024"
blurb = """Studio teaching is increasingly popular, but teaching in one is difficult, especially for new instructors. \
We studied how new instructors learn to teach in a studio environment through a collective ethnography of \
four undergrad course assistants. We identified challenges new instructors faced and strategies they in response."""
paper = "pdfs/ASEE_2024_ModSim_CAE.pdf"

[[params.research_section.entry]]
image = "images/snake_boomerang_700x1082.gif"
title = "Linear Kinematics for General Constant Curvature and Torsion Manipulators"
img_fit = "fill"
featured = true
authors = "**Bill Fan***, Farhan Rozaidi, Capprin Bass, Gina Olson, Melinda Malley, Ross L Hatton"
venue = "Lightning talk @ Robosoft 2023"
blurb = """Inspired by octopus arms, helically-wound muscles greatly increase continuum arm workspaces, but they are more difficult to model and control. \
We present a novel application of Lie theory to simplify the modeling of constant twist soft robots, and unify modeling across different designs. \
Won 3rd place best workshop poster."""
paper = "https://arxiv.org/abs/2302.11661"
poster = "pdfs/Robosoft_2023_Poster.pdf"

