pronouns = "they/any"

# Intro section paragraphs - each paragraph is a list entry
[[params.intro.paragraph]]
text="""I'm a 2nd year PhD student at the University of Texas, Austin, advised by Dr. Lillian Chin as a member of MERGe Lab. \
I am a National Science Foundation (NSF) **Graduate Research Fellowship** Fellow."""

[[params.intro.paragraph]]
text="""My research spans robotics tactile sensing, design, and accessibility. \
For robots, I am currently working on computational tools for optimizing tactile sensor designs. \
For design and accessibility, I am co-designing university campus accessibility solutions that center the knowledge disabled people already have and use."""

[[params.intro.paragraph]]
text="""Outside of research, I have industry experience working on SLAM at Dusty Robotics and microfluidics automation at XGenomes. \
When I'm not working, I like to take care of my house plants, cook, and read :)"""

