{{ partial "head_meta.html"}}
{{ partial "circle_arrow_icon.html"}}

<main>
    <header class="header_section" style="background: var(--faint-blue)">
        <div class="center">
            <div class="header_container">

                <div class="header_bar">
                    <div class="header_title">
                        <h1 class="no_margins">Projects</h1>
                    </div>

                    {{ partial "home_menu.html" (dict "current" "projects") }}
                </div>

                <a class="blue_text_button back_link" href="{{ "projects/" | absURL }}">
                    {{ partial "arrow_icon.html" "blue" }}
                    Back to Projects
                </a>

                <h2 style="margin-bottom:0px"> {{.Title}} </h2>

                {{/*  For each project entry, create a small project entry card  */}}
                <article itemprop="articleBody" id="content" class="w-90 lh-copy">
                    {{ .Content }}
                </article>
            </div>


    </header>
</main>
